# Receive logs from Docker logging driver (all microservices)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Parse the JSON structured logs from logstash-logback-encoder
<filter **>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</filter>

# Add container tag as source field
<filter **>
  @type record_transformer
  <record>
    source_tag ${tag}
  </record>
</filter>

# Forward everything to Splunk HEC
<match **>
  @type splunk_hec
  hec_host splunk
  hec_port 8088
  hec_token your-hec-token-here
  insecure_ssl true

  # Map log fields to Splunk index fields
  # "main" always exists on a fresh Splunk container. To use a dedicated
  # "microservices" index, create it first (see README) then change this value.
  index main
  sourcetype _json
  source ${tag}

  <buffer>
    @type file
    path /fluentd/log/splunk_buffer
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 1m
    retry_type exponential_backoff
    retry_max_interval 30s
    overflow_action block
  </buffer>
</match>
